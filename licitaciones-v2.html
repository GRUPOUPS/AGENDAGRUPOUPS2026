<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gestor de Licitaciones | Grupo UPS</title>
</head>
<body>
<script>
(async function(){
  try{
    let src = await fetch('licitaciones.html?base=' + Date.now(), {cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('No se pudo cargar el diseño base');
      return r.text();
    });

    /* 1) Conserva exactamente el diseño anterior y solo agrega estilos mínimos. */
    src = src.replace('</style>', `
      .critical-row{background:#fff8f7!important}
      .critical-row td:first-child{border-left:4px solid #d92d20}
      .critical-note{display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:5px 7px;border:1px solid #f2b8b2;border-radius:7px;background:#fff0ee;color:#b42318;font-size:9px;font-weight:950}
      .sub-badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:950;white-space:nowrap}
      .sub-yes{background:#e9f8f0;color:#087a4b}
      .sub-no{background:#fff0ee;color:#b42318;border:1px solid #f2b8b2}
      .exec-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:17px;margin-top:17px}
      .exec-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
      .exec-box{border:1px solid var(--border);border-radius:12px;padding:13px;background:#fff}
      .exec-key{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.03em}
      .exec-val{margin-top:5px;color:var(--blue-dark);font-weight:850;font-size:13px;line-height:1.4}
      .exec-offers{display:grid;gap:8px;margin-top:10px}
      .exec-offer{border:1px solid var(--border);border-radius:11px;padding:11px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
      .exec-offer.ours{background:#f6faff;border-color:#91b7e6}
      .exec-offer strong{color:var(--blue-dark);font-size:12px}
      .exec-offer span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
      .exec-score{display:grid;place-items:center;padding-top:6px}
      .exec-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) 0 74%,#e7ebf0 74%);position:relative}
      .exec-ring:after{content:"";width:112px;height:112px;border-radius:50%;background:#fff;position:absolute}
      .exec-ringtext{position:relative;z-index:1;text-align:center}
      .exec-ringtext strong{font-size:28px;color:var(--blue-dark)}
      .exec-ringtext span{display:block;color:var(--ok);font-size:11px;font-weight:900}
      @media(max-width:1050px){.exec-grid{grid-template-columns:1fr}}
      @media(max-width:700px){.exec-info{grid-template-columns:1fr}.exec-offer{flex-direction:column;align-items:flex-start}}
    </style>`, 1);

    /* 2) Solo se agrega una opción al menú lateral, sin cambiar el resto. */
    src = src.replace(
      '<button class="nav active" data-page="dashboard">⌂ Dashboard</button>',
      '<button class="nav active" data-page="dashboard">⌂ Dashboard</button>\n<button class="nav" data-page="resumen">★ Resumen Ejecutivo</button>'
    );

    /* 3) Resumen ejecutivo para el Ing., usando las mismas tarjetas y estilo del modelo anterior. */
    const resumen = `
<section class="page" id="resumen">
  <div class="hero">
    <div>
      <h2>Resumen Ejecutivo de la Licitación</h2>
      <p>Vista rápida con los datos más importantes para Ingeniería y Gerencia.</p>
    </div>
    <span class="pill">Vista ejecutiva</span>
  </div>

  <div class="exec-grid">
    <div class="panel">
      <div class="head">
        <div><h3>Información principal</h3><p>Qué se está licitando y datos clave del proceso.</p></div>
        <span class="status purple">SDO-LPI-002-2025</span>
      </div>
      <div class="exec-info">
        <div class="exec-box"><div class="exec-key">Nombre / proceso</div><div class="exec-val">SDO-LPI-002-2025</div></div>
        <div class="exec-box"><div class="exec-key">Entidad</div><div class="exec-val">Órgano Judicial</div></div>
        <div class="exec-box" style="grid-column:1/-1"><div class="exec-key">¿De qué trata la licitación?</div><div class="exec-val">Expansión y Fortalecimiento de Infraestructura de Respaldo y Servidores del Data Center.</div></div>
        <div class="exec-box"><div class="exec-key">Monto de referencia</div><div class="exec-val">US$5,075,000.00</div></div>
        <div class="exec-box"><div class="exec-key">Fecha de cierre</div><div class="exec-val">30/07/2026 · 10:00 a. m.</div></div>
        <div class="exec-box"><div class="exec-key">Nuestra oferta</div><div class="exec-val">US$4,720,000</div></div>
        <div class="exec-box"><div class="exec-key">Posición por precio</div><div class="exec-val">2 de 4</div></div>
      </div>
      <div class="alert" style="margin-top:12px;border-color:#f2b8b2;background:#fff8f7">
        <strong style="color:#b42318">⚠ Atención especial</strong>
        <span style="color:#7a271a">Hay requisitos NO SUBSANABLES. Deben revisarse con mayor cuidado antes de presentar la oferta.</span>
      </div>
    </div>

    <div class="panel">
      <div class="head"><div><h3>Probabilidad estimada</h3><p>Índice interno de competitividad.</p></div></div>
      <div class="exec-score">
        <div class="exec-ring" id="execRing"><div class="exec-ringtext"><strong id="execScore">74%</strong><span id="execScoreLabel">ALTA</span></div></div>
      </div>
      <div class="note">Este porcentaje es una estimación interna; no garantiza la adjudicación.</div>
    </div>
  </div>

  <div class="panel" style="margin-top:17px">
    <div class="head"><div><h3>Participantes y ofertas</h3><p>Comparación rápida posterior al cierre.</p></div><span class="status ok">4 OFERENTES</span></div>
    <div class="exec-offers">
      <div class="exec-offer"><div><strong>Empresa Gamma</strong><span>Oferta detectada · posición 1</span></div><strong>US$4,650,000</strong></div>
      <div class="exec-offer ours"><div><strong>Grupo UPS, S.A.</strong><span>Nuestra oferta · posición 2</span></div><strong>US$4,720,000</strong></div>
      <div class="exec-offer"><div><strong>Empresa Alpha</strong><span>Oferta detectada · posición 3</span></div><strong>US$4,890,000</strong></div>
      <div class="exec-offer"><div><strong>Empresa Beta</strong><span>Oferta detectada · posición 4</span></div><strong>US$5,010,000</strong></div>
    </div>
  </div>
</section>`;
    src = src.replace('<section class="page" id="nueva">', resumen + '\n<section class="page" id="nueva">');

    /* 4) Mantiene el sistema de navegación original y solo reconoce el resumen. */
    src = src.replace(
      "const titles={dashboard:'Dashboard de Licitaciones',nueva:",
      "const titles={dashboard:'Dashboard de Licitaciones',resumen:'Resumen Ejecutivo',nueva:"
    );

    /* 5) Agrega la columna Subsanabilidad sin tocar la lógica original de adjuntos ni firmas. */
    const mejoras = `
<script>
(function(){
  const noSubsanables = new Set([
    'Declaración de Mantenimiento de la Oferta',
    'Listas de Precios / Servicios Conexos'
  ]);

  function aplicarSubsanabilidad(){
    const tabla = document.querySelector('.req');
    const body = document.getElementById('rows');
    if(!tabla || !body) return;

    const headRow = tabla.querySelector('thead tr');
    if(headRow && !headRow.querySelector('[data-sub-head]')){
      const th = document.createElement('th');
      th.textContent = 'Subsanabilidad';
      th.setAttribute('data-sub-head','1');
      headRow.insertBefore(th, headRow.children[1]);
      tabla.style.minWidth = '930px';
    }

    [...body.querySelectorAll('tr')].forEach(tr=>{
      if(tr.dataset.subDone) return;
      const first = tr.querySelector('.rname');
      if(!first) return;
      const name = first.textContent.trim();
      const critical = noSubsanables.has(name);
      const td = document.createElement('td');
      td.innerHTML = critical
        ? '<span class="sub-badge sub-no">⚠ NO SUBSANABLE</span><div class="meta" style="color:#b42318;font-weight:800">Revisar con especial cuidado.</div>'
        : '<span class="sub-badge sub-yes">SUBSANABLE</span>';
      tr.insertBefore(td, tr.children[1]);
      if(critical){
        tr.classList.add('critical-row');
        if(!tr.querySelector('.critical-note')){
          first.parentElement.insertAdjacentHTML('beforeend','<div class="critical-note">⚠ REVISAR CON MUCHO CUIDADO</div>');
        }
      }
      tr.dataset.subDone='1';
    });
  }

  const body = document.getElementById('rows');
  if(body){
    new MutationObserver(aplicarSubsanabilidad).observe(body,{childList:true,subtree:true});
  }
  aplicarSubsanabilidad();

  const alertas = document.querySelector('#dashboard .alerts');
  if(alertas && !document.getElementById('subAlert')){
    const a = document.createElement('div');
    a.className='alert';
    a.id='subAlert';
    a.style.borderColor='#f2b8b2';
    a.style.background='#fff8f7';
    a.innerHTML='<strong style="color:#b42318">⚠ Documentos NO SUBSANABLES</strong><span style="color:#7a271a">Los marcados en rojo requieren una revisión más delicada antes de presentar la licitación.</span>';
    alertas.insertBefore(a, alertas.children[1] || null);
  }

  function sincronizarScore(){
    const original = document.getElementById('scoreTop');
    const exec = document.getElementById('execScore');
    const label = document.getElementById('execScoreLabel');
    const ring = document.getElementById('execRing');
    if(!original || !exec || !label || !ring) return;
    const n = parseInt(original.textContent) || 74;
    exec.textContent=n+'%';
    label.textContent=n>=75?'ALTA':n>=55?'MEDIA':'BAJA';
    ring.style.background='conic-gradient(var(--ok) 0 '+n+'%,#e7ebf0 '+n+'% 100%)';
  }
  sincronizarScore();
  const originalScore=document.getElementById('scoreTop');
  if(originalScore) new MutationObserver(sincronizarScore).observe(originalScore,{childList:true,characterData:true,subtree:true});
})();
<\/script>`;
    src = src.replace('</body>', mejoras + '\n</body>');

    document.open();
    document.write(src);
    document.close();
  }catch(err){
    document.body.innerHTML = '<div style="font-family:Arial;padding:40px"><h2>No se pudo cargar el Gestor de Licitaciones</h2><p>'+err.message+'</p></div>';
  }
})();
</script>
</body>
</html>
