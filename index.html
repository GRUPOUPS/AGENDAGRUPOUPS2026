<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Grupo UPS</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#202534}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.box{background:#fff;border:1px solid #dbe2ec;border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(22,34,51,.13);max-width:560px}.box strong{color:#073b80;font-size:20px}.box p{color:#667085;margin:10px 0 0}
</style>
</head>
<body>
<div class="loading"><div class="box"><strong>Cargando Agenda Grupo UPS…</strong><p>Preparando las herramientas internas.</p></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('index-base.html?v=20260916-informes',{cache:'no-store'});
    if(!response.ok) throw new Error('No se pudo cargar la agenda base.');
    let html=await response.text();

    const requireReplace=(oldText,newText,label)=>{
      if(!html.includes(oldText)) throw new Error('No se encontró el bloque: '+label);
      html=html.replace(oldText,newText);
    };

    const adminCard=`<a id="weeklyReportAdminOption" class="option hidden" href="#">
  <div class="icon">📎</div>
  <h3>Informes semanales</h3>
  <p>Adjunta el enlace vigente y elige a qué vendedor va dirigido.</p>
</a>`;

    const sellerCard=`<a id="weeklyReportAdminOption" class="option hidden" href="#">
  <div class="icon">📎</div>
  <h3>Informes semanales</h3>
  <p>Adjunta el archivo HTML y elige a qué vendedor va dirigido.</p>
</a>
        <a id="weeklyReportSellerOption" class="option hidden" href="ver-informe.html" target="_blank" rel="noopener noreferrer">
          <div class="icon">📄</div>
          <h3>Mi informe semanal</h3>
          <p>Consulta tu último informe semanal disponible.</p>
        </a>`;
    requireReplace(adminCard,sellerCard,'tarjeta de informes');

    const yorlenisHelper=`  function isYorlenis(profile){
    const t=profileText(profile);
    return normalizeText(profile?.person_code)==='yorlenis' || t.includes('yorlenis');
  }`;

    const sellerHelper=`  function isYorlenis(profile){
    const t=profileText(profile);
    return normalizeText(profile?.person_code)==='yorlenis' || t.includes('yorlenis');
  }

  function weeklyReportSellerKey(profile){
    const t=profileText(profile);
    if(t.includes('eguzman@grupoups.com') || t.includes('eric guzman')) return 'eric';
    if(t.includes('hmartinez@grupoups.com') || t.includes('hector martinez')) return 'hector';
    if(t.includes('ygoncalves@grupoups.com') || t.includes('yoselin') || t.includes('goncalves')) return 'yoselin';
    return null;
  }`;
    requireReplace(yorlenisHelper,sellerHelper,'identificación de vendedores');

    const callsAccess=`    const callsOption=document.getElementById('callsOption');
    if(callsOption) callsOption.classList.toggle('hidden',!isCallsShortcutUser(profile));`;

    const sellerAccess=`    const callsOption=document.getElementById('callsOption');
    if(callsOption) callsOption.classList.toggle('hidden',!isCallsShortcutUser(profile));
    const weeklyReportSellerOption=document.getElementById('weeklyReportSellerOption');
    if(weeklyReportSellerOption) weeklyReportSellerOption.classList.toggle('hidden',!weeklyReportSellerKey(profile));`;
    requireReplace(callsAccess,sellerAccess,'acceso al informe del vendedor');

    html=html.replace(
      'Selecciona el vendedor y guarda el enlace del informe semanal vigente.',
      'Selecciona el vendedor, adjunta el archivo HTML y revisa la vista previa antes de enviarlo.'
    );

    requireReplace(
      'storagePath=`informes-vendedores/${seller}/${Date.now()}_${safeFileName}`;',
      'storagePath=`informes-vendedores/${seller}/informe.html`;',
      'ruta del informe'
    );

    requireReplace('upsert:false','upsert:true','reemplazo del informe vigente');

    requireReplace(
      'const url=signedData.signedUrl;',
      "const reportUrl=signedData.signedUrl;\n      const viewerUrl=`https://grupoups.github.io/AGENDAGRUPOUPS2026/ver-informe.html?src=${encodeURIComponent(reportUrl)}`;",
      'enlace firmado'
    );

    requireReplace('const safeUrl=url','const safeUrl=viewerUrl','enlace del correo');

    html=html.replace(
      "msg.textContent='El informe se guardó, pero no se pudo enviar el correo.';",
      "msg.textContent='El archivo se subió, pero no se pudo enviar el correo.';"
    );

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="loading"><div class="box"><strong>No se pudo cargar la Agenda.</strong><p>Actualiza la página. Si el problema continúa, revisa la consola del navegador.</p></div></div>';
  }
})();
</script>
</body>
</html>
