name: Add Seguimiento Comercial shortcut

on:
  push:
    paths:
      - '.github/workflows/add-seguimiento-comercial-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shortcut for Yorlenis, Sebastian and Yoselin
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          card = '''

        <a id="callsOption" class="option hidden" href="https://grupoups.github.io/seguimientollamadas/" target="_blank" rel="noopener">
          <div class="icon">☎️</div>
          <h3>Seguimiento Comercial</h3>
          <p>Acceso a llamadas, clientes, cotizaciones y seguimientos comerciales.</p>
        </a>'''

          if 'id="callsOption"' not in text:
              anchor = '''        <a id="dashboardOption" class="option hidden" href="dashboard-semanal.html">
          <div class="icon">📊</div>
          <h3>Dashboard semanal</h3>
          <p id="dashboardMenuText">Consulta el resumen semanal del equipo comercial.</p>
        </a>'''
              if anchor not in text:
                  raise SystemExit('No se encontro dashboardOption para insertar el atajo')
              text = text.replace(anchor, anchor + card, 1)

          helper = '''

  function isCallsShortcutUser(profile){
    const t=profileText(profile);
    return isYorlenis(profile)
      || t.includes('recepcionsm@grupoups.com')
      || t.includes('sebasti')
      || t.includes('ygoncalves@grupoups.com')
      || t.includes('yoselin')
      || t.includes('goncalves');
  }'''

          if 'function isCallsShortcutUser' not in text:
              anchor = '''  function isReceptionAccount(profile){
    const t=profileText(profile);
    return t.includes('recepcionsm@grupoups.com')
      || t.includes('sebasti')
      || t.includes('recepcion');
  }'''
              if anchor not in text:
                  raise SystemExit('No se encontro isReceptionAccount para insertar helper')
              text = text.replace(anchor, anchor + helper, 1)

          old_open = '''  function openMenu(profile,user,access){
    setMenuAccess(access);
    document.getElementById('welcomeName').textContent=`Bienvenido(a), ${profile.full_name||'usuario'}`;
    document.getElementById('welcomeEmail').textContent=profile.email||user.email||'';
    show(menuView);
  }'''

          new_open = '''  function openMenu(profile,user,access){
    setMenuAccess(access);
    const callsOption=document.getElementById('callsOption');
    if(callsOption) callsOption.classList.toggle('hidden',!isCallsShortcutUser(profile));
    document.getElementById('welcomeName').textContent=`Bienvenido(a), ${profile.full_name||'usuario'}`;
    document.getElementById('welcomeEmail').textContent=profile.email||user.email||'';
    show(menuView);
  }'''

          if new_open not in text:
              if old_open not in text:
                  raise SystemExit('No se encontro openMenu para actualizar acceso')
              text = text.replace(old_open, new_open, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Seguimiento Comercial shortcut"
            git push
          fi
