name: Add Seguimiento Comercial shortcut

on:
  push:
    paths:
      - '.github/workflows/add-seguimiento-comercial-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar informes semanales
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          seller_card = '''
        <a id="weeklyReportSellerOption" class="option hidden" href="ver-informe.html" target="_blank" rel="noopener noreferrer">
          <div class="icon">📄</div>
          <h3>Mi informe semanal</h3>
          <p>Consulta tu último informe semanal disponible.</p>
        </a>
'''
          if 'id="weeklyReportSellerOption"' not in text:
              anchor = '''<a id="weeklyReportAdminOption" class="option hidden" href="#">
  <div class="icon">📎</div>
  <h3>Informes semanales</h3>
  <p>Adjunta el enlace vigente y elige a qué vendedor va dirigido.</p>
</a>'''
              if anchor not in text:
                  raise SystemExit('No se encontro weeklyReportAdminOption')
              text = text.replace(anchor, anchor + seller_card, 1)

          seller_helper = '''

  function weeklyReportSellerKey(profile){
    const t=profileText(profile);
    if(t.includes('eguzman@grupoups.com') || t.includes('eric guzman')) return 'eric';
    if(t.includes('hmartinez@grupoups.com') || t.includes('hector martinez')) return 'hector';
    if(t.includes('ygoncalves@grupoups.com') || t.includes('yoselin') || t.includes('goncalves')) return 'yoselin';
    return null;
  }'''
          if 'function weeklyReportSellerKey' not in text:
              anchor = '''  function isYorlenis(profile){
    const t=profileText(profile);
    return normalizeText(profile?.person_code)==='yorlenis' || t.includes('yorlenis');
  }'''
              if anchor not in text:
                  raise SystemExit('No se encontro isYorlenis')
              text = text.replace(anchor, anchor + seller_helper, 1)

          seller_toggle = '''    const weeklyReportSellerOption=document.getElementById('weeklyReportSellerOption');
    if(weeklyReportSellerOption) weeklyReportSellerOption.classList.toggle('hidden',!weeklyReportSellerKey(profile));
'''
          if "const weeklyReportSellerOption=document.getElementById('weeklyReportSellerOption')" not in text:
              anchor = '''    const callsOption=document.getElementById('callsOption');
    if(callsOption) callsOption.classList.toggle('hidden',!isCallsShortcutUser(profile));
'''
              if anchor not in text:
                  raise SystemExit('No se encontro callsOption')
              text = text.replace(anchor, anchor + seller_toggle, 1)

          text = text.replace('Adjunta el enlace vigente y elige a qué vendedor va dirigido.','Adjunta el archivo HTML y elige a qué vendedor va dirigido.',1)
          text = text.replace('Selecciona el vendedor y guarda el enlace del informe semanal vigente.','Selecciona el vendedor, adjunta el archivo HTML y revisa la vista previa antes de enviarlo.',1)

          old_path = "storagePath=`informes-vendedores/${seller}/${Date.now()}_${safeFileName}`;"
          new_path = "storagePath=`informes-vendedores/${seller}/informe.html`;"
          if old_path in text:
              text = text.replace(old_path,new_path,1)
          elif new_path not in text:
              raise SystemExit('No se encontro la ruta de Storage')

          old_upload = """          {
            upsert:false,
            contentType:'text/html; charset=utf-8'
          }"""
          new_upload = """          {
            upsert:true,
            contentType:'text/html; charset=utf-8'
          }"""
          if old_upload in text:
              text = text.replace(old_upload,new_upload,1)
          elif new_upload not in text:
              raise SystemExit('No se encontro la configuracion de upload')

          old_link = """      const url=signedData.signedUrl;
     msg.textContent='Archivo listo. Enviando correo...';
      const safeUrl=url
        .replace(/&/g,'&amp;')
        .replace(/\"/g,'&quot;');"""
          new_link = """      const reportUrl=signedData.signedUrl;
      const viewerUrl=`https://grupoups.github.io/AGENDAGRUPOUPS2026/ver-informe.html?src=${encodeURIComponent(reportUrl)}`;
      msg.textContent='Archivo listo. Enviando correo...';
      const safeUrl=viewerUrl
        .replace(/&/g,'&amp;')
        .replace(/\"/g,'&quot;');"""
          if old_link in text:
              text = text.replace(old_link,new_link,1)
          elif 'const viewerUrl=`https://grupoups.github.io/AGENDAGRUPOUPS2026/ver-informe.html?src=' not in text:
              raise SystemExit('No se encontro el enlace de correo')

          text = text.replace("msg.textContent='El informe se guardó, pero no se pudo enviar el correo.';","msg.textContent='El archivo se subió, pero no se pudo enviar el correo.';",1)

          path.write_text(text, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Agregar informes individuales para vendedores"
            git push
          fi