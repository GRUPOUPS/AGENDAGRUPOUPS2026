name: Activar propuesta economica simplificada
on:
  workflow_dispatch:
  push:
    paths:
      - 'licitaciones-v10.js'
jobs:
  activar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insertar script v10
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('licitaciones-v2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="licitaciones-v10.js?v=20260820-4"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- licitaciones-v2.html
          git diff --cached --quiet || git commit -m 'Aplicar propuesta económica simplificada'
          git push